name: Portable payload diagnosis
on:
  push:
    branches: [enterprise-restart]
    paths: [.github/workflows/portable-diagnose.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-diagnostics
          run-id: 36156586837
          github-token: ${{ github.token }}
          path: probe
      - name: Prepare isolated probe
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "portable-probe"
          New-Item -ItemType Directory -Path "$probe/portable/windows" -Force | Out-Null
          Copy-Item -LiteralPath "portable/windows/smoke.mjs" -Destination "$probe/portable/windows/smoke.mjs"
          Copy-Item -LiteralPath "portable/windows/proxy-fixture.mjs" -Destination "$probe/portable/windows/proxy-fixture.mjs"
          New-Item -ItemType Directory -Path "$probe/portable-dist" -Force | Out-Null
          Copy-Item -Path "probe/portable-dist/*-portable.zip" -Destination "$probe/portable-dist"
          $script = Get-Content -Raw -LiteralPath "$probe/portable/windows/smoke.mjs"
          $script = $script.Replace('assert((await page.locator("body").innerText()).trim().length > 10, "Renderer body is empty")', 'await page.waitForFunction(() => document.body.innerText.trim().length > 10, undefined, { timeout: 60000 })')
          Set-Content -LiteralPath "$probe/portable/windows/smoke.mjs" -Value $script -Encoding utf8
          npm install --prefix "$probe" --no-save --ignore-scripts playwright@1.59.1
      - name: Probe existing ZIPs
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP "portable-probe")
          node portable/windows/smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-probe
          path: |
            ${{ runner.temp }}/portable-probe/portable-dist/smoke-report.json
            ${{ runner.temp }}/portable-probe/portable-dist/smoke-logs/**
