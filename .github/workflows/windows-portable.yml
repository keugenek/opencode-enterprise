name: Windows portable ZIPs
on:
  push:
    branches: [enterprise-restart]
    paths:
      - "portable/**"
      - "packages/desktop/**"
      - ".github/workflows/windows-portable.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OPENCODE_CHANNEL: prod
      OPENCODE_VERSION: 1.18.32
      OPENCODE_PORTABLE: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Portable profile regressions
        working-directory: packages/desktop
        run: bun test src/main/portable.test.ts
      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun typecheck
      - name: Package desktop directory
        working-directory: packages/desktop
        run: bun run package --win --x64 --publish never
      - name: Assemble portable ZIPs
        shell: pwsh
        run: ./portable/windows/package.ps1
      - name: Test ZIP payloads and persistence
        run: node ./portable/windows/smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: windows-portable-zips
          path: |
            portable-dist/*-portable.zip
            portable-dist/SHA256SUMS
            portable-dist/smoke-report.json
            portable-dist/desktop.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: windows-portable-diagnostics
          path: |
            portable-dist/smoke-report.json
            portable-dist/smoke-logs/**
            packages/desktop/dist/builder-debug.yml
          if-no-files-found: ignore
