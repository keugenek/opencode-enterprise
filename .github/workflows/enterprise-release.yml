name: Enterprise build and release

on:
  pull_request:
    paths:
      - 'enterprise-patches/**'
      - 'mvp/**'
      - 'assurance/**'
      - 'delivery/**'
      - 'community/**'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'ENTERPRISE.md'
      - 'LICENSING.md'
      - '.github/workflows/enterprise-release.yml'
  push:
    branches: [dev, enterprise-patches]
    tags: ['enterprise-v*']
    paths:
      - 'enterprise-patches/**'
      - 'mvp/**'
      - 'assurance/**'
      - 'delivery/**'
      - 'community/**'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'ENTERPRISE.md'
      - 'LICENSING.md'
      - '.github/workflows/enterprise-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Test and build Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout distribution
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test patch maintenance and upstream candidate tooling
        working-directory: enterprise-patches/ci
        run: python3 -m unittest discover -s tests -v
      - name: Test MVP tooling and signed-report validation
        working-directory: mvp
        run: python3 -m unittest discover -s tests -v
      - name: Select version
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          if [[ "$BUILD_REF" == refs/tags/* ]]; then
            [[ "$BUILD_REF" =~ ^refs/tags/enterprise-v([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?)$ ]] || exit 1
            version="${BASH_REMATCH[1]}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "OPENCODE_VERSION=$version" >> "$GITHUB_ENV"
          echo "OPENCODE_CHANNEL=enterprise" >> "$GITHUB_ENV"
      - name: Verify checksums and apply reviewed patches
        run: python3 enterprise-patches/ci/prepare.py "$RUNNER_TEMP/patched-source"
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies without lifecycle scripts
        working-directory: ${{ runner.temp }}/patched-source
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd packages/core fix-node-pty
      - name: Enterprise regression tests
        working-directory: ${{ runner.temp }}/patched-source/packages/core
        run: bun test test/enterprise/policy.test.ts test/effect/observability.test.ts
      - name: Typecheck affected packages
        working-directory: ${{ runner.temp }}/patched-source
        run: |
          (cd packages/core && bun typecheck)
          (cd packages/opencode && bun typecheck)
          (cd packages/tui && bun typecheck)
      - name: Install smoke-test policy on disposable runner
        run: |
          test ! -e /etc/opencode/enterprise.json
          sudo install -d -o root -g root -m 0755 /etc/opencode
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/patched-source/enterprise/enterprise.example.json" /etc/opencode/enterprise.json
      - name: Build restricted CLI without embedded web UI
        working-directory: ${{ runner.temp }}/patched-source/packages/opencode
        run: bun run script/build.ts --single --skip-install --skip-embed-web-ui
      - name: Smoke-test compiled binary and fail-closed guards
        run: bash enterprise-patches/ci/smoke.sh "$RUNNER_TEMP/patched-source/packages/opencode/dist/opencode-linux-x64/bin/opencode" "$OPENCODE_VERSION"
      - name: Package binary, source, patch series, MVP toolkit and manifest
        run: python3 enterprise-patches/ci/package.py "$RUNNER_TEMP/patched-source" "$RUNNER_TEMP/release-assets"
      - name: Upload tested artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: enterprise-linux-x64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish tagged prerelease
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/enterprise-v') && github.repository == 'keugenek/opencode-enterprise'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested artifacts from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: enterprise-linux-x64
          path: release-assets
      - name: Verify assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('build-manifest.json'))
          assert manifest['distribution_commit'] == os.environ['GITHUB_SHA'], 'Unexpected source commit'
          assert manifest['version'] == os.environ['RELEASE_TAG'].removeprefix('enterprise-v'), 'Version mismatch'
          PY
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Restricted OpenCode Linux x64/glibc (AVX2) CLI/TUI candidate.

          Includes a compiled binary, patched source, the four-patch series, offline MVP installation toolkit and assurance process, build manifest and SHA-256 checksums. Requires administrator-managed /etc/opencode/enterprise.json and an internal inference gateway.

          Patch tests, public MVP tooling tests, typechecks and compiled-binary smoke checks passed in this workflow. Private customer evaluation is not run in public CI. Actual vLLM inference, production gateway, deployed network isolation and final image/SBOM scanning remain acceptance gates. This prerelease is not production certification.
          NOTES
          gh release create "$RELEASE_TAG" ./* --verify-tag --prerelease --latest=false --title "OpenCode Enterprise $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
