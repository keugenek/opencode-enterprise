name: Distribution improvement
description: Propose a common hardening, build, integration or documentation improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and supported use case
      description: Explain the shared need without customer-confidential requirements.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance
      description: Include intended public tests, security boundaries and upstream applicability.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Public scope
      options:
        - label: I have checked existing issues and can discuss this proposal publicly.
          required: true
