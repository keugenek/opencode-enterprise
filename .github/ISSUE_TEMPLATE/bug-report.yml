name: Distribution bug
description: Report a reproducible, non-sensitive bug in the public enterprise distribution.
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not use /share or include customer code, logs, prompts,
        screenshots, internal endpoints, credentials or private eval cases.
        Use the agreed private channel for customer incidents or vulnerabilities.
  - type: checkboxes
    id: public-data
    attributes:
      label: Public reproduction
      options:
        - label: This report contains only material I am authorized to publish and no sensitive customer data.
          required: true
  - type: input
    id: version
    attributes:
      label: Distribution commit or release
      description: Include the public upstream baseline and patch identity when available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Non-sensitive environment
      description: OS/architecture, tool versions and generic deployment profile; omit private network details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: Steps or a small public fixture, expected result and observed result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public verification and possible fix
      description: Relevant test command/output using synthetic data and any upstream issue reference.
    validations:
      required: false
